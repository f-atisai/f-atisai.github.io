name: Automated Validation

on:
  push:
  pull_request:

jobs:
  validate:
    name: Build Jekyll Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
