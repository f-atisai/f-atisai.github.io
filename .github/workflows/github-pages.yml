name: Build and Deploy to GitHub Pages

# Run the deployment whenever changes are pushed to the main branch
on:
  push:
    branches:
      - main

  # Allow the workflow to be triggered manually from the Actions tab
  workflow_dispatch:

# Permissions required by GitHub's official Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple GitHub Pages deployments from running concurrently
# while allowing an in-progress deployment to complete
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Build the Jekyll site and prepare it for deployment
  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest

    steps:
      # Check out the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up the Ruby environment used by the Jekyll project.
      # bundler-cache installs the dependencies from Gemfile.lock
      # and caches them for subsequent workflow runs.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      # Configure the environment and metadata required by GitHub Pages.
      # The generated base path is passed to Jekyll during the build.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Build the production version of the Jekyll site.
      # Jekyll writes the generated static site to the _site directory.
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}"

      # Package the generated _site directory as the artifact
      # that GitHub Pages will deploy.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  # Deploy the previously built artifact to GitHub Pages
  deploy:
    name: Deploy GitHub Pages

    # Register the deployment with the GitHub Pages environment
    # and expose the deployed site's URL in the workflow.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # Deployment must only start after the build job succeeds
    needs: build

    steps:
      # Deploy the uploaded artifact using GitHub's official
      # GitHub Pages deployment action.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
